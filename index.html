<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />

  <title>偶像梦幻祭 · 资料库</title>
  
  <style>
/* 心情钟 · 游戏资料库（标准软件规模大窗口）——浅色亮主题 */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  color-scheme: light;
  --bg: #f2f4fa;
  --bg2: #e8ebf4;
  --bg3: #dde2ee;
  --line: rgba(23,26,48,.08);
  --line2: rgba(23,26,48,.16);
  --txt: #23273d;
  --txt2: rgba(35,39,61,.68);
  --txt3: rgba(35,39,61,.48);
  --acc: #f0a;
  --acc2: #2563c9;
  --gold: #d4a017;
}
html, body { height: 100%; }
/* 基础浅色主题：浏览器直接打开本文件即为浅色预览 */
html, body {
  background: #f2f4fa;
  color: #23273d;
}
body {
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  font-size: 14px;
  overflow: hidden;
}
.app { display: flex; flex-direction: column; height: 100vh; }

/* 顶栏 */
.top {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.top-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
.top-title .logo { font-size: 20px; }
.top-title .ver {
  font-size: 12px; color: var(--txt3); font-weight: 400;
  background: rgba(23,26,48,.06); padding: 2px 8px; border-radius: 999px;
}
.search {
  margin-left: auto; width: 320px;
  background: #fff; border: 1px solid var(--line2); border-radius: 10px;
  padding: 8px 14px; color: var(--txt); font-size: 13.5px; outline: none;
}
.search:focus { border-color: var(--acc2); }

/* 主体：左导航 + 内容 */
.body { display: flex; flex: 1 1 auto; min-height: 0; }
.nav {
  width: 150px; flex: 0 0 auto;
  background: var(--bg2); border-right: 1px solid var(--line);
  padding: 14px 10px; display: flex; flex-direction: column; gap: 6px;
}
.nav-item {
  text-align: left; padding: 10px 14px; border-radius: 10px;
  border: 1px solid transparent; background: transparent;
  color: var(--txt2); font-size: 14px; cursor: pointer; font-family: inherit;
}
.nav-item:hover { background: rgba(23,26,48,.06); color: var(--txt); }
.nav-item.active { background: rgba(240,0,160,.14); border-color: rgba(240,0,160,.45); color: #fff; font-weight: 700; }

.content { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 18px 22px; }
.page { display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.page[hidden] { display: none !important; }

/* 偶像梦幻祭 tab */
.es-tabs { display: flex; gap: 8px; flex: 0 0 auto; }
.es-tab {
  padding: 7px 18px; border-radius: 999px; border: 1px solid var(--line2);
  background: transparent; color: var(--txt2); cursor: pointer; font-size: 13.5px; font-family: inherit;
}
.es-tab.active { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 700; }
.es-view { flex: 1 1 auto; min-height: 0; }

/* 角色图鉴：左角色列 + 右详情 */
.enc-layout { display: flex; gap: 18px; height: 100%; }
.enc-char-list {
  width: 210px; flex: 0 0 auto; overflow-y: auto;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; display: flex; flex-direction: column; gap: 6px;
}
.enc-char {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border-radius: 10px; border: 1px solid transparent;
  background: transparent; color: var(--txt); cursor: pointer; font-family: inherit; font-size: 14px;
}
.enc-char:hover { background: rgba(23,26,48,.06); }
.enc-char.active { background: rgba(240,0,160,.14); border-color: rgba(240,0,160,.45); color: #fff; }
.enc-char.active .unit { color: rgba(255,255,255,.75); }
.enc-char .unit { font-size: 11.5px; color: var(--txt3); }
.enc-detail { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding-bottom: 30px; }
.enc-info {
  font-size: 13.5px; color: var(--txt2);
  background: var(--bg2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; margin-bottom: 14px;
}
.enc-sec { font-size: 15px; font-weight: 700; color: var(--acc2); margin: 16px 0 10px; display: flex; align-items: center; gap: 8px; }
.enc-sec::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--acc2); }
.enc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.enc-item {
  background: #fff; border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; display: flex; flex-direction: column; gap: 7px;
  box-shadow: 0 1px 3px rgba(23,26,48,.05);
}
.enc-item:hover { border-color: var(--line2); }
.enc-img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 10px; cursor: zoom-in; background: rgba(0,0,0,.3); }
.enc-name { font-size: 14px; font-weight: 700; line-height: 1.45; }
.enc-star { font-size: 13.5px; color: var(--gold); }
.enc-note { font-size: 12.5px; color: var(--txt2); line-height: 1.55; }
.enc-src { font-size: 12px; color: var(--txt3); line-height: 1.5; }
.enc-src a { color: var(--acc2); text-decoration: none; cursor: pointer; }
.enc-src a:hover { text-decoration: underline; }

/* 五星时间线 */
.tl-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tl-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.tl-filter {
  padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line2);
  background: transparent; color: var(--txt2); cursor: pointer; font-size: 12.5px; font-family: inherit;
}
.tl-filter.active { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 700; }
.tl-count { font-size: 12.5px; color: var(--txt3); }
.tl-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.tl-year { font-size: 15px; font-weight: 700; color: var(--acc2); margin: 14px 0 6px; }
.tl-row {
  display: flex; align-items: center; gap: 12px;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px;
  box-shadow: 0 1px 3px rgba(23,26,48,.05);
}
.tl-row:hover { border-color: var(--line2); }
.tl-date { flex: 0 0 auto; font-size: 12.5px; color: var(--txt2); min-width: 86px; }
.tl-type {
  flex: 0 0 auto; font-size: 12px; padding: 2px 9px; border-radius: 999px;
  background: rgba(37,99,201,.1); color: var(--acc2); border: 1px solid rgba(37,99,201,.3);
}
.tl-type.cn { background: rgba(180,132,0,.12); color: #8a6400; border-color: rgba(180,132,0,.3); }
.tl-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tl-name { font-size: 14px; font-weight: 600; }
.tl-sub { font-size: 12.5px; color: var(--txt2); }
.tl-note { font-size: 12px; color: var(--txt3); }

/* 日服情报 */
.jp-list, .sched-list { display: flex; flex-direction: column; gap: 10px; }
.jp-card, .sched-card {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 16px; display: flex; flex-direction: column; gap: 5px;
  box-shadow: 0 1px 3px rgba(23,26,48,.05);
}
.jp-card.live { border-color: rgba(220,140,10,.5); background: rgba(255,180,60,.1); }
.jp-card.soon { border-color: rgba(34,160,90,.35); }
.jp-card .jp-type {
  align-self: flex-start; font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: rgba(37,99,201,.1); color: var(--acc2);
}
.jp-card.live .jp-type { background: rgba(255,180,60,.18); color: #b45309; }
.jp-card.soon .jp-type { background: rgba(34,160,90,.12); color: #1f7a45; }
.jp-title { font-size: 15px; font-weight: 700; }
.jp-note { font-size: 13px; color: var(--txt2); line-height: 1.6; }

/* 万象棋 */
.wz-wrap { display: flex; flex-direction: column; gap: 12px; }
.wz-sec { font-size: 15px; font-weight: 700; color: var(--acc2); margin: 10px 0 4px; }
.wz-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; line-height: 1.7; font-size: 13.5px; color: var(--txt); box-shadow: 0 1px 3px rgba(23,26,48,.05); }
.wz-card b { color: #b45309; }

/* 术语表 */
.term-intro { font-size: 13px; color: var(--txt2); }
.term-groups { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
.term-group-title { font-size: 15px; font-weight: 700; color: var(--acc2); }
.term-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.term-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; box-shadow: 0 1px 3px rgba(23,26,48,.05); }
.term-card .t-name { font-size: 14px; font-weight: 700; }
.term-card .t-jp { font-size: 12px; color: var(--txt3); margin-left: 6px; }
.term-card .t-desc { font-size: 12.5px; color: var(--txt2); margin-top: 4px; line-height: 1.6; }
.term-card .t-src { font-size: 11.5px; color: var(--txt3); margin-top: 4px; }

/* 版本日志 */
.log-wrap { display: flex; flex-direction: column; gap: 14px; }
.log-ver { font-size: 17px; font-weight: 700; }
.log-date { font-size: 12.5px; color: var(--txt3); margin-left: 10px; }
.log-items { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.log-items li { margin-left: 18px; font-size: 13.5px; color: var(--txt); line-height: 1.6; }

/* 放大层 */
.zoom {
  position: fixed; inset: 0; z-index: 500; background: rgba(15,20,40,.94);
  display: flex; align-items: center; justify-content: center; cursor: zoom-out;
}
.zoom img { max-width: 92%; max-height: 92%; border-radius: 14px; object-fit: contain; box-shadow: 0 12px 60px rgba(0,0,0,.7); }
.zoom-close {
  position: absolute; top: 18px; right: 22px; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.16); color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.zoom-close:hover { background: rgba(255,255,255,.3); }

.empty2 { font-size: 13px; color: var(--txt3); padding: 20px 0; }

/* —— 浅色亮主题覆盖块：系统强制暗色已因初始深色底跳过，此处把界面渲染成浅色 —— */
body {
  background: #f2f4fa !important;
  color: #23273d !important;
}
.top { background: #e8ebf4 !important; color: #23273d !important; }
.nav { background: #e8ebf4 !important; }
.nav-item { color: #3c4257 !important; }
.nav-item:hover { background: rgba(23,26,48,.06) !important; }
.nav-item.active { background: rgba(240,0,160,.14) !important; border-color: rgba(240,0,160,.45) !important; color: #fff !important; }
.tl-filter { color: #3c4257 !important; }
.es-tab { color: #3c4257 !important; }
.enc-char { color: #3c4257 !important; }
.enc-char:hover { background: rgba(23,26,48,.06) !important; }
.enc-char.active { background: rgba(240,0,160,.14) !important; border-color: rgba(240,0,160,.45) !important; color: #fff !important; }
.enc-card, .tl-card, .jp-card, .wz-card, .term-card, .in-card { background: #fff !important; border-color: rgba(23,26,48,.12) !important; color: #23273d !important; }
.search-input, .field, input, select, textarea { background: #fff !important; color: #23273d !important; }
.empty2, .muted, .sub { color: #5b6478 !important; }

/* —— 按偶像选歌 —— */
.song-mode-row { margin-bottom: 8px; }
.sm-wrap { display: inline-flex; background: #eef2f7; border-radius: 999px; padding: 3px; gap: 2px; }
.sm-btn { border: none; background: none; font-size: 12.5px; font-weight: 700; color: #5b6478; padding: 5px 14px; border-radius: 999px; cursor: pointer; line-height: 1.4; white-space: nowrap; }
.sm-btn.on { background: #2563c9; color: #fff; }
.song-hint { font-size: 12.5px; color: #5b6478; line-height: 1.6; }
/* 大页面偶像搜索输入框 */
.song-search-box { position: relative; display: flex; align-items: center; margin: 8px 0 4px; max-width: 480px; }
.song-search-box input {
  width: 100%; border: 1px solid rgba(23,26,48,.16); background: #fff; color: #23273d;
  border-radius: 999px; padding: 7px 34px 7px 14px; font-size: 13px; outline: none;
  box-shadow: inset 0 1px 2px rgba(23,26,48,.04);
}
.song-search-box input:focus { border-color: rgba(37,99,201,.6); box-shadow: 0 0 0 2px rgba(37,99,201,.14); }
.song-search-box input::placeholder { color: #9aa1b5; }
.song-search-clear {
  position: absolute; right: 8px; border: none; background: rgba(23,26,48,.12); color: #3c4257;
  width: 19px; height: 19px; border-radius: 50%; font-size: 11px; line-height: 1; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.song-search-clear:hover { background: rgba(37,99,201,.22); color: #2563c9; }
.song-idols { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding: 2px; }
/* 列表模式（老版本大列表搜索） */
.idol-list { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; max-height: 460px; overflow-y: auto; padding-right: 4px; border: 1px solid rgba(23,26,48,.14); border-radius: 8px; background: #fff; }
.il-group-name { font-size: 12.5px; font-weight: 800; color: #2563c9; padding: 8px 10px 3px; background: #f2f5fb; position: sticky; top: 0; }
.il-row { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid rgba(23,26,48,.07); font-size: 13.5px; color: #2c3344; }
.il-row:hover { background: #f0f4fa; }
.il-row.on { background: rgba(240,0,160,.18); color: #fff; }
.il-row.on .il-ja, .il-row.on .il-en { color: #ffe9f3; }
.il-cn { font-weight: 700; min-width: 76px; }
.il-ja { color: #6b7589; font-size: 12.5px; min-width: 82px; }
.il-en { color: #98a1b5; font-size: 12px; }
.song-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.song-group-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.song-unit { font-size: 12.5px; font-weight: 700; color: #2563c9; min-width: 88px; }
.song-idol { padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(23,26,48,.14); cursor: pointer; font-size: 12.5px; color: #3c4257; background: #fff; }
.song-idol:hover { background: rgba(23,26,48,.06); }
.song-idol.active { background: rgba(240,0,160,.16); border-color: rgba(240,0,160,.5); color: #fff; font-weight: 700; }
.song-toolbar { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
.song-count { font-size: 12.5px; color: #5b6478; }
.song-list { display: flex; flex-direction: column; gap: 10px; }
.song-card { background: #fff; border: 1px solid rgba(23,26,48,.12); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.song-card-body { min-width: 0; flex: 1; }
.song-cover { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; border: 1px solid rgba(23,26,48,.1); cursor: zoom-in; }
/* 歌曲筛选按钮（大页面） */
.sf-row { display: flex; gap: 6px; flex-wrap: wrap; }
.lib-sf { margin-left: auto; }
.lib-sf .sf-btn {
  flex: none; min-width: 52px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid rgba(209,91,60,.45); background: rgba(209,91,60,.08);
  color: #d15b3c; font-size: 12.5px; font-weight: 700; cursor: pointer; line-height: 1.5;
}
.lib-sf .sf-btn.on { background: #d15b3c; color: #fff; border-color: #d15b3c; }
.lib-sf2 { margin-top: 8px; margin-left: 0; }
.lib-sf .sf-btn.mv-btn.on[data-mv="game"] { background: #1f9d6b; border-color: #1f9d6b; }
/* 歌曲卡片 MV 类型小标签（大页面） */
.song-mvtag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.6; vertical-align: 1px; }
.song-mvtag.game { background: #e3f6ec; color: #1f9d6b; border: 1px solid #1f9d6b; }
.song-mvtag.nomv { background: #f2f2f6; color: #6b7280; border: 1px solid #9ca3af; }
/* 封面点击放大层（大页面） */
.cover-zoom {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(10,12,22,.82); display: flex; align-items: center; justify-content: center;
  cursor: zoom-out; padding: 3vh 3vw;
}
.cover-zoom img {
  max-width: 92vw; max-height: 90vh; object-fit: contain;
  border-radius: 14px; box-shadow: 0 18px 60px rgba(0,0,0,.55);
}
/* 歌曲详情弹层（大页面） */
.song-detail-mask {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(8,10,20,.78); display: flex; align-items: center; justify-content: center;
  padding: 3vh 4vw;
}
.song-detail {
  background: #fff; color: #1b2030; border-radius: 16px;
  width: min(430px, 92vw); max-height: 86vh; overflow: auto;
  box-shadow: 0 20px 70px rgba(0,0,0,.5); padding: 18px 20px 20px; position: relative;
  font-size: 14px; text-align: left;
}
.song-detail-close {
  position: absolute; top: 8px; right: 10px; background: none; border: none;
  font-size: 19px; color: #7a8198; cursor: pointer; padding: 4px 6px; line-height: 1; border-radius: 8px;
}
.song-detail-close:hover { color: #1b2030; background: #eef2f7; }
.song-detail-head { display: flex; gap: 14px; align-items: flex-start; margin: 2px 0 12px; }
.song-detail-cover {
  width: 108px; height: 108px; object-fit: cover; border-radius: 12px; cursor: zoom-in;
  box-shadow: 0 6px 18px rgba(0,0,0,.16); flex: none;
}
.song-detail-info { min-width: 0; flex: 1; }
.song-detail-title { font-size: 17px; font-weight: 800; line-height: 1.35; word-break: break-all; }
.song-detail-uni { font-size: 13px; color: #4a5268; margin-top: 4px; word-break: break-all; }
.song-detail-tags { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
.song-detail-tag { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
.song-detail-tag.game { background: #dcfce7; color: #15803d; }
.song-detail-tag.nomv { background: #eef2f7; color: #5b6478; }
.song-detail-tag.cn { background: #f3e8ff; color: #7c3aed; }
.song-detail-sec { font-size: 13px; font-weight: 800; margin: 13px 0 6px; }
.song-detail-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; }
.song-detail-row + .song-detail-row { margin-top: 5px; }
.song-detail-row .k { color: #7a8198; flex: none; width: 62px; }
.song-detail-mem { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.song-detail-mem span { background: #eef2f7; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; color: #232a3d; }
.song-detail-mem span b { font-weight: 700; }
.song-detail-mem span i { font-style: normal; color: #8a91a6; font-size: 12px; }
.song-detail-src a { color: #2563eb; text-decoration: none; word-break: break-all; }
.song-detail-src a:hover { text-decoration: underline; }
.song-detail-note { font-size: 12px; color: #8a91a6; margin-top: 12px; line-height: 1.5; }
.song-detail-note a { color: #2563eb; text-decoration: none; }
.song-detail-note a:hover { text-decoration: underline; }
.song-sec { font-size: 14px; font-weight: 800; color: #1f3a5f; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #2563c9; }
.song-sec:first-child { margin-top: 0; }
.song-name { font-size: 14px; font-weight: 700; color: #23273d; }
.song-cn { font-size: 11.5px; color: #8a5a00; font-weight: 400; }
.song-unit2 { font-size: 12px; color: #2563c9; font-weight: 700; margin-top: 3px; }
.song-tags { font-size: 12px; color: #3c4257; margin-top: 4px; }

  (function () {

      var els = document.querySelectorAll("div, span, section, button, a");
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.children && el.children.length > 0) continue;
        var t = (el.textContent || "").trim();
        if (t === "豆包AI生成" || t === "问AI" || t.indexOf("豆包AI生成") === 0 || t.indexOf("问AI") === 0) {
          el.style.display = "none";
          el.style.visibility = "hidden";
        }
      }
    }
    hideDpFloater();
    if (window.MutationObserver) {
      var mo = new MutationObserver(hideDpFloater);
      mo.observe(document.documentElement, { childList: true, subtree: true });
    }
  })();
  // 浮动确定键：可拖动移动位置（中间靠右初始位置）
  (function () {
    var go = document.getElementById("songGo");
    if (!go || !window.PointerEvent) return;
    var dragging = false, moved = false, suppress = false, sx = 0, sy = 0, ox = 0, oy = 0;
    go.addEventListener("pointerdown", function (e) {
      dragging = true; moved = false; suppress = false;
      sx = e.clientX; sy = e.clientY;
      var r = go.getBoundingClientRect();
      ox = r.left; oy = r.top;
      try { go.setPointerCapture(e.pointerId); } catch (err) {}
    });
    go.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 10) moved = true;
      var nx = ox + (e.clientX - sx);
      var ny = oy + (e.clientY - sy);
      nx = Math.max(4, Math.min(window.innerWidth - go.offsetWidth - 4, nx));
      ny = Math.max(4, Math.min(window.innerHeight - go.offsetHeight - 4, ny));
      go.style.left = nx + "px";
      go.style.top = ny + "px";
      go.style.right = "auto";
    });
    go.addEventListener("pointerup", function () {
      dragging = false;
      if (moved) suppress = true;
    });
    go.addEventListener("pointercancel", function () { dragging = false; });
    go.addEventListener("click", function (e) {
      if (suppress) { e.preventDefault(); e.stopPropagation(); suppress = false; }
      moved = false;
    });
  })();

  <script>
/* 球窗 / 记事本共用：时间、存储、备忘 */
(function (global) {
  const SCHEMA_VERSION = 2;
  const BACKUP_FORMAT = "moodclock-backup@2";

  const KEYS = {
    memos: "ball-pet-v2-memos",
    skin: "ball-pet-v2-skin",
    settings: "ball-pet-v2-settings",
    stats: "ball-pet-v2-stats",
    noteDay: "ball-pet-v2-note-day",
    reminded: "ball-pet-v2-reminded",
    meta: "mood-meta",
  };

  const DEFAULT_SETTINGS = {
    work: 25,
    break: 5,
    long: 15,
    cycle: 4,
    auto: false,
    sound: true,
    top: true,
    opacity: 100,
    pierce: false,
    water: 45,
    stand: 60,
    ballScale: 100, // 50–180
    dailyGoal: 8, // 今日番茄目标
    warn1min: true, // 结束前1分钟提醒
    autostart: false, // 开机启动
    telemetry: false, // 崩溃/诊断日志（默认关）
  };

  function uuidLite() {
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  function loadMeta() {
    return loadJSON(KEYS.meta, {});
  }

  function saveMeta(m) {
    saveJSON(KEYS.meta, m);
  }

  /** 首次启动写 schema + 设备 id；旧数据自动升到 SCHEMA_VERSION */
  function ensureSchema(deviceIdFromHost) {
    const meta = loadMeta();
    let changed = false;
    if (!meta.deviceId) {
      meta.deviceId = deviceIdFromHost || uuidLite();
      changed = true;
    }
    if (deviceIdFromHost && meta.deviceId !== deviceIdFromHost) {
      meta.deviceId = deviceIdFromHost;
      changed = true;
    }
    const from = Number(meta.schemaVersion) || 1;
    if (from < SCHEMA_VERSION) {
      // v1 → v2：补默认设置字段，统计结构保持 days/streak
      const s = loadSettings();
      if (typeof s.telemetry !== "boolean") s.telemetry = false;
      if (typeof s.autostart !== "boolean") s.autostart = false;
      saveSettings(s);
      meta.schemaVersion = SCHEMA_VERSION;
      meta.migratedAt = new Date().toISOString();
      changed = true;
    } else if (!meta.schemaVersion) {
      meta.schemaVersion = SCHEMA_VERSION;
      changed = true;
    }
    if (!meta.createdAt) {
      meta.createdAt = new Date().toISOString();
      changed = true;
    }
    if (changed) saveMeta(meta);
    return meta;
  }

  function collectStore() {
    const store = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      if (k.startsWith("ball-pet") || k.startsWith("mood-")) {
        store[k] = localStorage.getItem(k);
      }
    }
    return store;
  }

  function buildBackup(appVersion) {
    const meta = ensureSchema();
    return {
      format: BACKUP_FORMAT,
      schemaVersion: SCHEMA_VERSION,
      appVersion: appVersion || "",
      deviceId: meta.deviceId || "",
      exportedAt: new Date().toISOString(),
      store: collectStore(),
    };
  }

  /** 接受 backup@2 或旧版 { store } */
  function normalizeBackup(data) {
    if (!data || typeof data !== "object") return { ok: false, error: "文件格式不对" };
    if (data.store && typeof data.store === "object") {
      return { ok: true, data, legacy: data.format !== BACKUP_FORMAT };
    }
    return { ok: false, error: "文件里没有 store 数据" };
  }

  function applyStore(store) {
    Object.keys(store || {}).forEach((k) => {
      const v = store[k];
      if (v == null) localStorage.removeItem(k);
      else localStorage.setItem(k, v);
    });
    ensureSchema();
  }

  const SKINS = [
    { id: "sunny", name: "暖阳", flags: ["blush", "ticks"] },
    { id: "cloud", name: "云朵", flags: ["blush"] },
    { id: "matcha", name: "抹茶", flags: ["blush", "ticks"] },
    { id: "sakura", name: "樱花", flags: ["blush"] },
    { id: "moonlit", name: "月影", flags: ["ticks"] },
    { id: "cocoa", name: "可可", flags: ["blush"] },
    { id: "lemon", name: "柠檬", flags: ["blush"] },
    { id: "berry", name: "莓果", flags: ["blush"] },
    { id: "jelly", name: "软糖", flags: ["blush"] },
    { id: "ink", name: "青墨", flags: ["ticks"] },
    { id: "lava", name: "熔岩", flags: [] },
    { id: "cat", name: "喵呜", flags: ["ears", "blush"] },
  ];

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function nowTimeStr() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatDateCN(ymd) {
    const [y, m, d] = ymd.split("-");
    return `${y}年${Number(m)}月${Number(d)}日`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function loadJSON(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v == null ? fallback : v;
    } catch {
      return fallback;
    }
  }

  function saveJSON(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
  }

  function migrateMemos(raw) {
    // 兼容旧 key
    if (!raw || !raw.length) {
      try {
        raw = JSON.parse(localStorage.getItem("ball-pet-memos") || "[]");
      } catch {
        raw = [];
      }
    }
    return (raw || []).map((m) => ({
      id: m.id || Date.now() + Math.random(),
      text: m.text || "",
      done: !!m.done,
      date: m.date || todayStr(),
      time: m.time || "09:00",
      prio: m.prio || "mid",
      cat: m.cat || autoCat(m.text || ""), // 旧数据自动补类别，不丢原记录
      lead: m.lead || 0, // 提前预警天数（0=无）
    }));
  }

  function loadMemos() {
    return migrateMemos(loadJSON(KEYS.memos, []));
  }

  function saveMemos(list) {
    saveJSON(KEYS.memos, list);
    if (global.app && global.app.notifyMemosChanged) {
      global.app.notifyMemosChanged();
    }
  }

  function memosOnDate(ymd) {
    const po = { high: 0, mid: 1, low: 2 };
    return loadMemos()
      .filter((m) => m.date === ymd)
      .sort(
        (a, b) =>
          (po[a.prio] || 1) - (po[b.prio] || 1) ||
          (a.time || "").localeCompare(b.time || "")
      );
  }

  function datesWithMemos() {
    const set = new Set();
    loadMemos().forEach((m) => set.add(m.date));
    return set;
  }

  function loadSettings() {
    return { ...DEFAULT_SETTINGS, ...loadJSON(KEYS.settings, {}) };
  }

  function saveSettings(s) {
    saveJSON(KEYS.settings, s);
  }

  function loadStats() {
    return loadJSON(KEYS.stats, { days: {}, streak: 0, lastDay: "" });
  }

  function saveStats(s) {
    saveJSON(KEYS.stats, s);
  }

  function bumpTomato(mins) {
    const s = loadStats();
    const d = todayStr();
    if (!s.days[d]) s.days[d] = { tomatoes: 0, mins: 0 };
    s.days[d].tomatoes++;
    s.days[d].mins += mins;
    if (s.lastDay !== d) {
      const y = new Date();
      y.setDate(y.getDate() - 1);
      const ystr = `${y.getFullYear()}-${pad(y.getMonth() + 1)}-${pad(y.getDate())}`;
      s.streak = s.lastDay === ystr ? (s.streak || 0) + 1 : 1;
      s.lastDay = d;
    }
    saveStats(s);
    return s;
  }

  function beep(kind) {
    const settings = loadSettings();
    if (!settings.sound) return;
    try {
      const ctx = new (global.AudioContext || global.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.type = kind === "soft" ? "triangle" : "sine";
      o.frequency.value = kind === "remind" ? 660 : kind === "soft" ? 440 : 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);
      o.start();
      o.stop(ctx.currentTime + 0.35);
      setTimeout(() => ctx.close(), 400);
    } catch (_) {}
  }

  function prioMark(p) {
    const c = p === "high" ? "high" : p === "low" ? "low" : "mid";
    return `<span class="prio ${c}">●</span>`;

    { id: "study", name: "学习", color: "#34d399", keys: ["上课", "考试", "复习", "作业", "论文", "学习", "网课", "补课", "图书馆", "自习", "报名", "讲座", "课程", "交作业"] },
    { id: "game",  name: "游戏", color: "#a78bfa", keys: ["游戏", "卡池", "抽卡", "抽奖", "十连", "钻石", "副本", "开服", "维护", "排位", "组队", "开黑", "联机", "公会", "签到", "礼包", "公测", "内测", "肝", "活动", "皮肤", "角色", "宝箱"] },
    { id: "life",  name: "生活", color: "#f472b6", keys: ["买菜", "快递", "取件", "缴费", "水电", "燃气", "打扫", "健身", "跑步", "体检", "加油", "维修", "银行", "存钱", "取钱", "家务", "做饭", "洗衣服", "遛狗", "购物", "超市"] },
    { id: "other", name: "其他", color: "#94a3b8", keys: [] },
  ];
  // 匹配优先级：约定 → 工作 → 学习 → 游戏 → 生活（更具体的先命中）
  const CAT_ORDER = ["meet", "work", "study", "game", "life"];

  function autoCat(text) {
    const t = String(text || "");
    for (const id of CAT_ORDER) {
      const c = CATS.find((x) => x.id === id);
      if (c && c.keys.some((k) => t.includes(k))) return id;
    }
    return "other";
  }

  function catOf(m) {
    return m && m.cat ? m.cat : autoCat(m && m.text);
  }

  function catName(id) {
    const c = CATS.find((x) => x.id === id);
    return c ? c.name : "其他";
  }

  function catColor(id) {
    const c = CATS.find((x) => x.id === id);
    return c ? c.color : "#94a3b8";
  }

  function catMark(id) {
    const c = CATS.find((x) => x.id === id) || CATS[CATS.length - 1];
    return `<span class="cat" style="--cat:${c.color}">${c.name}</span>`;
  }

  // —— 智能日程识别（自然语言日期时间 → 备忘条目）——
  const WEEK_CN = ["日", "一", "二", "三", "四", "五", "六"];

  function nextWeekday(target) {
    // target: 0=周日 … 6=周六；返回"下一个该星期几"的日期（今天不算）
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    let diff = (target - d.getDay() + 7) % 7;
    if (diff === 0) diff = 7;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function ymdOf(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function shiftDays(n) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + n);
    return d;
  }

  // 行内按标点切成子句（支持一行多个日程："明天开会，后天交方案"）
  function splitClauses(line) {
    return String(line)
      .split(/[，。；、,;]/)
      .map((s) => s.trim())
      .filter(Boolean);
  }

  // 从一行文本里解析出 {date, time, rest, lead}；date/time 可能为 null
  function parseScheduleLine(raw) {
    let text = String(raw || "").trim();
    if (!text) return null;

    // —— 提前预警：提前N天 / 提前两天（作业类）——
    let lead = 0;
    let leadUsed = "";
    const CN_NUM = { 一: 1, 两: 2, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
    let lm = text.match(/(?:需要|要|请|记得)?提前(\d{1,2})[天日](?:做|交|提交)?/);
    if (!lm) lm = text.match(/(?:需要|要|请|记得)?提前([一两二三四五六七八九十]+)[天日](?:做|交|提交)?/);
    if (lm) {
      const v = lm[1];
      lead = /^\d+$/.test(v) ? Number(v) : CN_NUM[v] || 0;
      if (lead > 0 && lead <= 30) {
        leadUsed = lm[0];
      } else {
        lead = 0;
      }
    }

    // —— 时间（无歧义优先）——
    let time = null;
    let timeUsed = "";
    // 时间范围：14:00-16:00 / 18:00至20:00 → 取开始时间
    let m = text.match(/(\d{1,2})[:：](\d{1,2})\s*(?:[-~—至到])\s*(\d{1,2})[:：](\d{1,2})/);
    if (m) {
      const h = Number(m[1]);
      const mi = Number(m[2]);
      if (h <= 23 && mi <= 59) {
        time = `${pad(h)}:${pad(mi)}`;
        timeUsed = m[0];
      }
    }
    // x:xx / x：xx（含截止词：18:00前交）
    if (!time) {
      m = text.match(/(\d{1,2})[:：](\d{1,2})(前交|之前|前|止|截止)?/);
      if (m) {
        const h = Number(m[1]);
        const mi = Number(m[2]);
        if (h <= 23 && mi <= 59) {
          time = `${pad(h)}:${pad(mi)}`;
          timeUsed = m[0];
        }
      }
    }
    // 几点半：3点半 / 上午9点半（须在 X点Y分 之前，避免吃掉"半"）
    if (!time) {
      m = text.match(/(上午|早上|凌晨|下午|晚上|中午)?\s*(\d{1,2})点半/);
      if (m) {
        let h = Number(m[2]);
        const pre = m[1] || "";
        if ((pre === "下午" || pre === "晚上") && h < 12) h += 12;
        if (pre === "凌晨" && h === 12) h = 0;
        if (h <= 23) {
          time = `${pad(h)}:30`;
          timeUsed = m[0];
        }
      }
    }
    // 几点几分 / 几点（含截止词）
    if (!time) {
      m = text.match(/(上午|早上|凌晨|下午|晚上|中午)?\s*(\d{1,2})点(\d{1,2})?分?(前交|之前|前|止|截止)?/);
      if (m) {
        let h = Number(m[2]);
        const pre = m[1] || "";
        if ((pre === "下午" || pre === "晚上") && h < 12) h += 12;
        if (pre === "凌晨" && h === 12) h = 0;
        if (h <= 23) {
          time = `${pad(h)}:${m[3] ? pad(Number(m[3])) : "00"}`;
          timeUsed = m[0];
        }
      }
    }
    // 点号时间：仅当紧跟截止词（18.00前 / 17.30前），避免与 M.D 日期混淆
    if (!time) {
      m = text.match(/(\d{1,2})[.．](\d{2})(前交|之前|前|止|截止)/);
      if (m) {
        const h = Number(m[1]);
        const mi = Number(m[2]);
        if (h <= 23 && mi <= 59) {
          time = `${pad(h)}:${pad(mi)}`;
          timeUsed = m[0];
        }
      }
    }

    // 时间 token 先移除，避免干扰日期（如 "10.30 18.00前" → "10.30" 是日期）
    let dsearch = text;
    if (timeUsed) dsearch = dsearch.replace(timeUsed, " ");

    // —— 日期 ——
    let date = null;
    let dateUsed = "";
    // 固定日期：YYYY-MM-DD / YYYY年M月D日 / YYYY.M.D
    m = dsearch.match(/(\d{4})[年.\-\/](\d{1,2})[月.\-\/](\d{1,2})日?/);
    if (m) {
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      if (!Number.isNaN(d.getTime())) {
        date = d;
        dateUsed = m[0];
      }
    }
    // M月D日 / M月D号
    if (!date) {
      m = dsearch.match(/(\d{1,2})月(\d{1,2})[日号]/);
      if (m) {
        const now = new Date();
        let d = new Date(now.getFullYear(), Number(m[1]) - 1, Number(m[2]));
        if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
          d = new Date(now.getFullYear() + 1, Number(m[1]) - 1, Number(m[2]));
        }
        if (!Number.isNaN(d.getTime())) {
          date = d;
          dateUsed = m[0];
        }
      }
    }
    // M.D / M/D（如 11.7、10.30、10/28），排除小数单位（5.2公里 / 1.5小时）
    if (!date) {
      const UNIT = /^(?:小时|分钟|公里|千米|米|厘米|毫米|千克|公斤|克|斤|元|块|毛|个|次|倍|折|分|秒|天|周|月|年|%|号)/;
      const cands = [...dsearch.matchAll(/(\d{1,2})[.\/](\d{1,2})[日号]?/g)];
      for (const mm of cands) {
        const mo = Number(mm[1]);
        const dd = Number(mm[2]);
        const after = dsearch.slice(mm.index + mm[0].length).trim();
        if (UNIT.test(after)) continue;
        if (mo >= 1 && mo <= 12 && dd >= 1 && dd <= 31) {
          const now = new Date();
          let d = new Date(now.getFullYear(), mo - 1, dd);
          if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
            d = new Date(now.getFullYear() + 1, mo - 1, dd);
          }
          if (!Number.isNaN(d.getTime())) {
            date = d;
            dateUsed = mm[0];
          }
          break;
        }
      }
    }
    // 下周X（"下周一"或"下周 周一"均可，= 最近的下一个该星期几）
    if (!date) {
      m = dsearch.match(/下周(?:[周星期]([日一二三四五六天])|([日一二三四五六天]))/);
      if (m) {
        const target = WEEK_CN.indexOf((m[1] || m[2]).replace("天", "日"));
        if (target >= 0) {
          date = nextWeekday(target);
          dateUsed = m[0];
        }
      }
    }
    // 周X / 星期X
    if (!date) {
      m = dsearch.match(/[周星期]([日一二三四五六天])/);
      if (m) {
        const target = WEEK_CN.indexOf(m[1].replace("天", "日"));
        if (target >= 0) {
          date = nextWeekday(target);
          dateUsed = m[0];
        }
      }
    }
    // 大后天 / 后天 / 明天 / 今天（含 今晚/今夜/今早/今晨）
    if (!date) {
      m = dsearch.match(/(大后天|后天|明天|今天|今晚|今夜|今早|今晨)/);
      if (m) {
        const kw = m[1];
        if (kw === "今晚" || kw === "今夜" || kw === "今早" || kw === "今晨") date = shiftDays(0);
        else date = shiftDays({ 大后天: 3, 后天: 2, 明天: 1, 今天: 0 }[kw]);
        dateUsed = kw;
      }
    }

    // 移除已识别的提前/日期/时间词，剩余作为内容
    let rest = text;
    if (leadUsed) rest = rest.replace(leadUsed, " ").trim();
    if (timeUsed) rest = rest.replace(timeUsed, " ").trim();
    if (dateUsed) rest = rest.replace(dateUsed, " ").trim();
    // 清理残留
    rest = rest.replace(/^(上午|早上|凌晨|中午|下午|晚上|今晚|今夜|今早|今晨)\s*/g, "").trim();
    rest = rest.replace(/^[-—·]\s*/, "").trim();
    rest = rest.replace(/^[日号]\s*/, "").trim();
    rest = rest.replace(/^[的]\s*/, "").trim();
    rest = rest.replace(/[，。！？；,.;:：\s]+$/, "").trim();
    if (!rest) rest = null;

    return { date, dateUsed, time, timeUsed, rest, lead };
  }

  // 识别整段笔记本文本，返回候选条目 [{date(ymd), time, text, lead}]
  function parseScheduleText(raw) {
    const lines = String(raw || "")
      .split(/\r?\n/)
      .map((l) => l.trim())
      .filter(Boolean);
    const out = [];
    lines.forEach((line) => {
      // 一行内可含多个日程（用标点分隔）
      const clauses = splitClauses(line);
      if (!clauses.length) return;
      clauses.forEach((clause) => {
        const r = parseScheduleLine(clause);
        if (!r) return;
        const ymd = r.date ? ymdOf(r.date) : todayStr();
        const time = r.time || "09:00";
        let text = r.rest;
        if (!text) {
          // 整句只有日期/时间没有内容时，保留原句去掉标点
          text = clause.replace(/[，。！？；,.;:：]/g, " ").trim();
        }
        if (!text) return;
        out.push({ date: ymd, time, text, lead: r.lead || 0 });
      });
    });
    return out;
  }

  // 把候选条目去重后加入备忘；返回 { added, skipped }
  function addScheduleItems(items) {
    const list = loadMemos();
    const exists = new Set(list.map((m) => `${m.date}|${m.time}|${m.text}`));
    let added = 0;
    let skipped = 0;
    (items || []).forEach((it) => {
      const key = `${it.date}|${it.time}|${it.text}`;
      if (exists.has(key)) {
        skipped++;
        return;
      }
      list.unshift({
        id: Date.now() + Math.random(),
        text: it.text,
        done: false,
        date: it.date,
        time: it.time,
        prio: "mid",
        cat: autoCat(it.text),
        lead: it.lead || 0,
      });
      exists.add(key);
      added++;
    });
    saveMemos(list);
    return { added, skipped };
  }

  // 预警日期：备忘日期往前推 lead 天
  function leadDateOf(m) {
    if (!m || !m.lead) return null;
    const [y, mo, d] = String(m.date).split("-").map(Number);
    if (!y || !mo || !d) return null;
    const dt = new Date(y, mo - 1, d);
    dt.setDate(dt.getDate() - m.lead);
    return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  }

  // —— 偶像梦幻祭：偶像按组合分组（球内浮层 / 缩略版 / 资料库大页面共用）——
  // 常驻组合顺序（官网 Discography 名义；MaM 在 Double Face 前；SPP/MELLOW 等活动限定组合不算常驻，成员归「其他角色」）
  const ES_UNIT_ORDER = ["fine", "trickstar", "流星隊", "ALKALOID", "Eden", "Valkyrie", "Crazy:B", "2wink", "Ra*bits", "紅月", "UNDEAD", "Knights", "Switch", "MaM", "Double Face"];
  // 归并别名：官网数据里大小写/日英文不统一的名义
  const ES_UNIT_ALIAS = { eden: "Eden", AKATSUKI: "紅月", "trickstar": "trickstar", "fine-Ø": "fine-Ø", "Fine": "fine", "Trickstar": "trickstar" };
  // 无分组价值的歌曲名义：跳过（不参与偶像分组）
  const ES_SKIP_UNITS = new Set(["null", "others", "ESオールスターズ"]);

  // 常规组合（纯组合曲名义）——歌曲只归「组合曲」区块；MaM（斑单人组合）、Double Face（斑+琥珀）在游戏里也是正式组合，曲目归组合曲
  const ES_MAIN_UNITS = ["fine", "trickstar", "流星隊", "ALKALOID", "Eden", "Valkyrie", "Crazy:B", "2wink", "Ra*bits", "紅月", "UNDEAD", "Knights", "Switch", "MaM", "Double Face"];
  // 非正式组合（特殊组合）——歌曲只归「非组合曲」区块（SPP/MELLOW 多人曲）
  const ES_SPECIAL_UNITS = ["Adam", "Eve", "Special for Princess!", "MELLOW DEAR US"];
  // 名义归并（别名 → 标准名）
  function esUnitKey(u) {
    if (!u) return u;
    return ES_UNIT_ALIAS[u] || u;
  }
  // 歌曲分类：all=全员曲 / unit=组合曲（常驻组合名义，含 MaM 单人组合与 Double Face，不论人数）/ multi=多组合形式的组合曲（跨组合/洗牌/企划/VS等，≥2人）/
  //           other=非正式组合曲（Eve/Adam/SPP/MELLOW 多人）/ solo=单人曲（成员个人名义演唱）
  function songKind(s) {
    if (s.t === "all") return "all";
    const key = esUnitKey(s.u);
    if (ES_MAIN_UNITS.indexOf(key) >= 0) return "unit";
    if (!s.i || s.i.length === 1) return "solo";
    if (ES_SPECIAL_UNITS.indexOf(key) >= 0) return "other";
    return "multi";
  }
  function idolNorm(s) {
    return String(s || "").replace(/\s+/g, "").toLowerCase();
  }
  // SPP（Special for Princess!）成员国服暂无中文译名，按国服参考显示罗马音（Yume 等）
  const ES_ROME_IDOLS = new Set(["エス", "カンナ", "ユメ", "ライカ"]);
  // 角色名统一：日文名 → 国服中文名（ES_ROLE_NAMES 反查）；SPP 成员用罗马音；无中文映射的保持原名
  function normIdolName(id) {
    const roles = global.ES_ROLE_NAMES || {};
    if (roles[id]) {
      if (ES_ROME_IDOLS.has(id)) return roles[id].en || id;
      return id; // 已是中文名
    }
    const n = idolNorm(id);
    const found = Object.keys(roles).find((cn) => idolNorm(roles[cn].ja) === n || idolNorm(roles[cn].en) === n);
    if (found) {
      if (ES_ROME_IDOLS.has(found)) return roles[found].en || found;
      return found;
    }
    return id;
  }

  // 偶像按「主组合」分组：每个偶像只归入一个组合。
  // 主组合 = 该偶像参与的常规组合曲中出现次数最多的组合（跨组合合唱/翻唱不会抢走主组合），
  // 出现次数相同取 ES_UNIT_ORDER 靠前者；无法归组的进「其他角色」
  function buildIdolGroups() {
    const S = global.ES_SONGS || [];
    if (!S.length) return [];
    const idolCnt = {}; // 规范名 -> { unit: 出现次数 }
    S.forEach((s) => {
      if (s.t === "all") return; // 全员曲不参与
      const u = s.u;
      if (!u || ES_SKIP_UNITS.has(u)) return;
      if (s.i.length === 1 && u === s.i[0]) return; // solo 曲名义跳过
      const key = ES_UNIT_ALIAS[u] || u;
      const rank = ES_UNIT_ORDER.indexOf(key);
      if (rank < 0) return; // 非主组合名义（洗牌/企划/联动等）不参与
      s.i.forEach((id) => {
        const n = normIdolName(id);
        (idolCnt[n] = idolCnt[n] || {})[key] = (idolCnt[n][key] || 0) + 1;
      });
    });
    const idolMain = {}; // 规范名 -> 主组合
    Object.keys(idolCnt).forEach((n) => {
      let best = null;
      let bestCnt = -1;
      Object.keys(idolCnt[n]).forEach((u) => {
        const cnt = idolCnt[n][u];
        if (cnt > bestCnt || (cnt === bestCnt && (best === null || ES_UNIT_ORDER.indexOf(u) < ES_UNIT_ORDER.indexOf(best)))) {
          best = u;
          bestCnt = cnt;
        }
      });
      idolMain[n] = best;
    });
    const unitIdols = {};
    Object.keys(idolMain).forEach((n) => {
      (unitIdols[idolMain[n]] = unitIdols[idolMain[n]] || []).push(n);
    });
    // 斑（三毛缟斑）同时属于 MaM 和 Double Face：若主组合是 MaM，则也加入 Double Face 组（反之亦然）
    const MADARA = "三毛缟斑";
    if (idolMain[MADARA] === "MaM") {
      if (!(unitIdols["Double Face"] || []).includes(MADARA)) {
        (unitIdols["Double Face"] = unitIdols["Double Face"] || []).push(MADARA);
      }
    } else if (idolMain[MADARA] === "Double Face") {
      if (!(unitIdols["MaM"] || []).includes(MADARA)) {
        (unitIdols["MaM"] = unitIdols["MaM"] || []).push(MADARA);
      }
    }
    // 琥珀（樱河琥珀）同属 Crazy:B 和 Double Face（DF 是斑+琥珀的双人正式组合）：也加入 Double Face 组
    const KOUHAKU = "樱河琥珀";
    if (!(unitIdols["Double Face"] || []).includes(KOUHAKU)) {
      (unitIdols["Double Face"] = unitIdols["Double Face"] || []).push(KOUHAKU);
    }
    // 维吹（滝维吹）：官网名义「紅月 with 滝維吹」属紅月系（天翔KAGETSU 等曲），加入紅月组
    const IBUKI = "滝维吹";
    if (!(unitIdols["紅月"] || []).includes(IBUKI)) {
      (unitIdols["紅月"] = unitIdols["紅月"] || []).push(IBUKI);
    }
    const groups = ES_UNIT_ORDER
      .filter((u) => unitIdols[u] && unitIdols[u].length)
      .map((u) => ({ name: u, idols: unitIdols[u] }));
    // 特殊组合（非正式组合：MELLOW DEAR US / Special for Princess! / Adam / Eve）单独分组，
    // 成员从对应名义（纯组合名，不含 VS）的歌曲中提取；曲目归「非组合曲」区块
    const specialIdols = {};
    S.forEach((s) => {
      if (s.t === "all") return;
      const u = ES_UNIT_ALIAS[s.u] || s.u;
      if (ES_SPECIAL_UNITS.indexOf(u) < 0) return;
      s.i.forEach((id) => {
        const n = normIdolName(id);
        (specialIdols[u] = specialIdols[u] || []);
        if (!specialIdols[u].includes(n)) specialIdols[u].push(n);
      });
    });
    ES_SPECIAL_UNITS.forEach((su) => {
      if (specialIdols[su] && specialIdols[su].length) {
        groups.push({ name: su, idols: specialIdols[su] });
      }
    });
    // 兜底：没归入任何主组合的角色（联动角色/特殊角色等）

  // 概率计算：已抽 have 抽后，下一次出当期 UP 五星（1.5%）所需抽数期望
  function oddsForPull(n) {
    n = Math.max(0, Math.round(Number(n) || 0));
    const p = ODDS.up5;
    const notIn = Math.pow(1 - p, n);
    const oneIn = 1 - notIn; // 已 n 抽至少出过一次 UP 五星的概率
    const nextExpected = 1 / p; // 从 0 开始抽到 UP 五星的期望抽数
    return {
      have: n,
      pUp: p,
      oneInSoFar: oneIn,
      stillNo: notIn,
      nextExpected: Math.round(nextExpected),
      // 再抽 x 抽，至少出一次 UP 五星的概率曲线采样
      curve: [10, 20, 30, 50, 67].map((x) => ({
        pulls: x,
        prob: 1 - Math.pow(1 - p, x),
      })),
    };
  }

        five++;
      } else if (r < ODDS.star5) {
        five++;

  // —— 页面与视图切换 ——
  function renderEs() { /* es 页内容由页签（图鉴/时间线/日服/排期）切换渲染 */ }
  function switchPage(page) {
    document.querySelectorAll(".nav-item").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
    ["es", "songs", "wz", "term", "log"].forEach((p) => {
      const el = $("page-" + p);
      if (el) el.hidden = p !== page;
    });
    if (page === "es") renderEs();
    if (page === "songs") renderSongs();
    if (page === "wz") renderWz();
    if (page === "term") renderTerms();
    if (page === "log") renderLog();
  }

  function switchEsView(view) {
    document.querySelectorAll(".es-tab").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    ["enc", "timeline", "jp", "sched"].forEach((v) => {
      const el = $("view-" + v);
      if (el) el.hidden = v !== view;
    });
    if (view === "enc") renderEnc();
    if (view === "timeline") renderTimeline();
    if (view === "jp") renderJp();
    if (view === "sched") renderSched();
  }

  // —— 角色图鉴 ——
  let encSel = "";
  function renderEnc() {
    const G = window.EsGacha;
    if (!G) return;
    const side = $("encCharList");
    if (!side) return; // 网页版无图鉴页时跳过
    const list = G.encCharacterList();
    if (!list.includes(encSel)) encSel = G.encDefaultId();
    const cur = G.encById(encSel);

    side.innerHTML = "";
    list.forEach((id) => {
      const c = G.encById(id);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "enc-char" + (id === encSel ? " active" : "");
      b.innerHTML = `<span>${esc(c.name)}</span>${c.unit ? `<span class="unit">${esc(c.unit)}</span>` : ""}`;
      b.onclick = () => { encSel = id; renderEnc(); };
      side.appendChild(b);
    });

    const det = $("encDetail");
    if (!cur) { det.innerHTML = `<div class="empty2">暂无图鉴数据</div>`; return; }
    let html = `<div class="enc-info">${esc(cur.info)}${cur.jp ? `　（${esc(cur.jp)}）` : ""}</div>`;

    html += `<div class="enc-sec">卡面（${(cur.cards || []).length}）</div>`;
    if (cur.cards && cur.cards.length) {
      html += `<div class="enc-grid">`;
      cur.cards.forEach((cd) => {
        html += `<div class="enc-item">
          ${cd.img ? `<img class="enc-img" src="${cd.img}" alt="" data-zoom="${cd.img}" />` : ""}
          <div class="enc-name">${esc(cd.name)}</div>
          <div class="enc-star">${cd.star}</div>
          <div class="enc-src">来源：${esc(cd.src)}${cd.link ? ` <a data-link="${esc(cd.link)}">查看 →</a>` : ""}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="empty2">暂无卡面图</div>`;
    }

    html += `<div class="enc-sec">3D / MV 服装（${(cur.outfits || []).length}）</div>`;
    if (cur.outfits && cur.outfits.length) {
      html += `<div class="enc-grid">`;
      cur.outfits.forEach((o) => {
        html += `<div class="enc-item">
          ${o.img ? `<img class="enc-img" src="${o.img}" alt="" data-zoom="${o.img}" />` : ""}
          <div class="enc-name">${esc(o.name)}</div>
          ${o.note ? `<div class="enc-note">${esc(o.note)}</div>` : ""}
          <div class="enc-src">来源：${esc(o.src)}${o.link ? ` <a data-link="${esc(o.link)}">查看 →</a>` : ""}</div>
        </div>`;
      });
      html += `</div>`;
    }
    det.innerHTML = html;

    det.querySelectorAll(".enc-img").forEach((img) => {
      img.onclick = () => openZoom(img.dataset.zoom || img.src);
    });
    det.querySelectorAll("a[data-link]").forEach((a) => {
      a.onclick = (e) => { e.stopPropagation(); if (window.app) window.app.openLink(a.dataset.link); };
    });
  }

  // —— 五星时间线（完整数据：日服580 + 国服84，采集校验完成）——
  function timelineItems() {
    const FULL = window.ES2_FULL;
    if (FULL && Array.isArray(FULL.star5) && FULL.star5.length) {
      return FULL.star5
        .map((s) => ({
          date: s.date,
          server: s.server === "CN" ? "CN" : "JP",
          type: s.type || "五星卡",
          name: s.cardName && s.cardName !== "unknown" ? `${s.cardName} · ${s.char || ""}` : (s.pool || "") + (s.char ? " · " + s.char : ""),
          chars: s.char ? [s.char] : [],
          note: [s.pool, s.note].filter(Boolean).join(" · "),
          src: s.src || "",
        }))
        .sort((a, b) => (a.date || "99").localeCompare(b.date || "99"));
    }
    const G = window.EsGacha;
    if (!G) return [];
    const out = [];
    // 日服情报
    (G.JP_NEWS || []).forEach((j) => {
      out.push({ date: j.start, server: "JP", type: j.type, name: j.title, chars: j.chars || [], note: j.note, src: "日服情报微博 @EnsembleStars" });
    });
    // 国服卡池排期
    (G.allSchedule ? G.allSchedule() : []).forEach((s) => {
      out.push({ date: s.start, server: "CN", type: s.typeName ? s.typeName : (G.typeNameOf ? G.typeNameOf(s.type) : "卡池"), name: s.title, chars: s.chars || [], note: s.note || "", src: "官方公告" });
    });
    // 国服五星卡
    (G.STAR5 || []).forEach((s) => {
      out.push({ date: s.date, server: "CN", type: "五星卡", name: `${s.card} · ${s.char}`, chars: [s.char], note: s.pool, src: "官方公告" });
    });
    return out.sort((a, b) => (a.date || "99").localeCompare(b.date || "99"));
  }
  let tlServer = "ALL";
  function renderTimeline() {
    const G = window.EsGacha;
    const items = timelineItems();
    const filters = ["ALL", "JP", "CN"];
    $("tlFilters").innerHTML = "";
    filters.forEach((f) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tl-filter" + (f === tlServer ? " active" : "");
      b.textContent = f === "ALL" ? "全部" : (f === "JP" ? "日服" : "国服");
      b.onclick = () => { tlServer = f; renderTimeline(); };
      $("tlFilters").appendChild(b);
    });
    const shown = tlServer === "ALL" ? items : items.filter((i) => i.server === tlServer);
    const FULL = window.ES2_FULL;
    const jpN = FULL && FULL.star5 ? FULL.star5.filter((s) => s.server !== "CN").length : 0;
    const cnN = FULL && FULL.star5 ? FULL.star5.filter((s) => s.server === "CN").length : 0;
    $("tlCount").textContent = FULL ? `共 ${shown.length} 条（日服 ${jpN} / 国服 ${cnN}，逐年齐全）` : `共 ${shown.length} 条`;

    const list = $("tlList");
    if (!shown.length) { list.innerHTML = `<div class="empty2">暂无数据</div>`; return; }
    let html = "";
    let lastYear = "";
    shown.forEach((i) => {
      const y = (i.date || "").slice(0, 4) || "—";
      if (y !== lastYear) { html += `<div class="tl-year">${y} 年</div>`; lastYear = y; }
      html += `<div class="tl-row">
        <div class="tl-date">${esc(i.date || "—")}</div>
        <div class="tl-type${i.server === "CN" ? " cn" : ""}">${i.server === "CN" ? "国服" : "日服"} · ${esc(i.type)}</div>
        <div class="tl-main">
          <div class="tl-name">${esc(i.name)}</div>
          ${i.chars && i.chars.length ? `<div class="tl-sub">${esc(i.chars.join(" / "))}</div>` : ""}
          ${i.note ? `<div class="tl-note">${esc(i.note)}</div>` : ""}
        </div>
        <div class="tl-note">${esc(i.src || "")}</div>
      </div>`;
    });
    list.innerHTML = html;
  }

  // —— 日服情报 ——
  function renderJp() {
    const G = window.EsGacha;
    if (!G) { $("jpList").innerHTML = `<div class="empty2">数据未加载</div>`; return; }
    const list = $("jpList");
    let html = "";
    (G.JP_NEWS || []).forEach((j) => {
      const st = G.jpStatusOf(j);
      const cls = st === "live" ? "live" : st === "upcoming" ? "soon" : "";
      const tag = st === "live" ? "进行中" : st === "upcoming" ? "即将开启" : "已结束";
      html += `<div class="jp-card ${cls}">
        <span class="jp-type">${esc(j.type)} · ${tag}</span>
        <div class="jp-title">${esc(j.title)}${j.chars && j.chars.length ? " · " + esc(j.chars.join("/")) : ""}</div>
        <div class="jp-note">${esc(j.start)} 开启${j.end ? " → " + esc(j.end) + " 结束" : "（结束时间官方未公布）"}<br>${esc(j.note)}</div>
        <div class="jp-note">来源：日服情报微博 @EnsembleStars</div>
      </div>`;
    });
    list.innerHTML = html;
  }

  // —— 卡池排期（国服） ——
  function renderSched() {
    const G = window.EsGacha;
    if (!G) { $("schedList").innerHTML = `<div class="empty2">数据未加载</div>`; return; }
    const list = $("schedList");
    let html = `<div class="empty2" style="margin-bottom:10px">国服近期卡池与活动排期（来源：官方公告；未来条目为日服进度推测）</div>`;
    (G.allSchedule ? G.allSchedule() : []).forEach((s) => {
      const y = s.startDate ? s.startDate.getFullYear() : "";
      const ey = s.endDate ? s.endDate.getFullYear() : y;
      const dateTxt = s.end
        ? `${y}.${esc(s.startLabel)} → ${ey !== y ? ey + "." : ""}${esc(s.endLabel)}`
        : `${y}.${esc(s.startLabel)}`;
      html += `<div class="sched-card">
        <div class="jp-type">${esc(s.typeName ? s.typeName : (G.typeNameOf ? G.typeNameOf(s.type) : "卡池"))}${s.predict ? " <span style='color:#d15b3c;font-weight:700'>· 日服推测</span>" : ""}</div>
        <div class="jp-title">${esc(s.title)}${s.chars && s.chars.length ? " · " + esc(s.chars.join("/")) : ""}</div>
        <div class="jp-note">${dateTxt} 开启${s.note ? " · " + esc(s.note) : ""}</div>
      </div>`;
    });
    list.innerHTML = html;
  }

  // —— 按偶像选歌 ——
  const songSel = new Set();
  let libSongFilter = "all";
  let libSongMV = "all";
  let libSongMode = "list"; // 默认大列表选人模式
  function setLibSongMode(m) {
    libSongMode = m;
    document.querySelectorAll(".sm-btn").forEach((b) => {
      b.classList.toggle("on", b.dataset.sm === m);
    });
    const filters = $("libSongFilters");
    if (filters) filters.hidden = m !== "advanced";
    const chips = $("songIdols");
    if (chips) chips.hidden = m === "list";
    const listBox = $("libSongIdolsList");
    if (listBox) listBox.hidden = m !== "list";
    if (m === "list") renderLibIdolList();
    if (m === "simple" && libSongFilter !== "all") setLibSongFilter("all");
    else renderSongList();
  }
  function renderLibIdolList() {
    const box = $("libSongIdolsList");
    if (!box) return;
    const groups = window.PetShared ? PetShared.buildIdolGroups() : [];
    const input = $("libSongSearch");
    const q = idolNorm(input ? input.value : "");
    let html = "";
    groups.forEach((g) => {
      if (!g.idols.length) return;
      let rows = "";
      g.idols.forEach((idol) => {
        const nm = (window.ES_ROLE_NAMES && window.ES_ROLE_NAMES[idol]) || {};
        if (q && !idolNorm(idol).includes(q) && !idolNorm(nm.ja).includes(q) && !idolNorm(nm.en).includes(q)) return;
        rows += `<div class="il-row${songSel.has(idol) ? " on" : ""}" data-idol="${escAttr(idol)}">
          <span class="il-cn">${esc(idol)}</span>
          ${nm.ja ? `<span class="il-ja">${esc(nm.ja)}</span>` : ""}
          ${nm.en ? `<span class="il-en">${esc(nm.en)}</span>` : ""}
        </div>`;
      });
      if (!rows) return;
      html += `<div class="il-group-name">${esc(g.name)}</div>` + rows;
    });
    if (!html) html = `<div class="empty2">没有匹配的偶像，换个名字试试</div>`;
    box.innerHTML = html;
    box.querySelectorAll(".il-row").forEach((row) => {
      row.onclick = () => {
        const idol = row.dataset.idol;
        if (songSel.has(idol)) songSel.delete(idol);
        else songSel.add(idol);
        row.classList.toggle("on", songSel.has(idol));
        renderIdolGroups();
      };
    });
  }
  function setLibSongFilter(f) {
    libSongFilter = f;
    document.querySelectorAll(".lib-sf .sf-btn").forEach((b) => {
      b.classList.toggle("on", b.dataset.sf === f);
    });
    renderSongList();
  }
  function setLibSongMV(f) {
    libSongMV = f;
    document.querySelectorAll(".lib-sf .mv-btn").forEach((b) => {
      b.classList.toggle("on", b.dataset.mv === f);
    });
    renderSongList();
  }
  function renderIdolGroups() {
    const S = window.ES_SONGS || [];
    const idolBox = $("songIdols");
    if (!idolBox) return;
    // 偶像按组合分组（与球内共用 buildIdolGroups：常规组合在前，其他名义，兜底其他角色）
    const groups = window.PetShared ? PetShared.buildIdolGroups() : [];
    const q = idolNorm($("libSongSearch") ? $("libSongSearch").value : "");
    let html = "";
    groups.forEach((g) => {
      if (!g.idols.length) return;
      const members = q ? g.idols.filter((m) => {
        const nm = (window.ES_ROLE_NAMES && window.ES_ROLE_NAMES[m]) || {};
        return idolNorm(m).includes(q) || idolNorm(nm.ja).includes(q) || idolNorm(nm.en).includes(q);
      }) : g.idols;
      if (!members.length) return;
      html += `<div class="song-group"><span class="song-unit">${esc(g.name)}</span><div class="song-group-chips">`;
      members.forEach((m) => {
        const nm = window.ES_ROLE_NAMES && window.ES_ROLE_NAMES[m];
        const tip = nm ? `日文：${nm.ja} · 英文：${nm.en || "待确认"}` : "";
        html += `<button type="button" class="es-tab song-idol${songSel.has(m) ? " active" : ""}" data-idol="${escAttr(m)}" title="${escAttr(tip)}">${esc(m)}</button>`;
      });
      html += `</div></div>`;
    });
    idolBox.innerHTML = html;
    idolBox.querySelectorAll(".song-idol").forEach((b) => {
      b.onclick = () => {
        const idol = b.dataset.idol;
        if (songSel.has(idol)) songSel.delete(idol);
        else songSel.add(idol);
        // 只更新选中高亮，不立即搜索；点「确定搜索」再出结果
        renderIdolGroups();
      };
    });
  }
  function renderSongs() {
    renderIdolGroups();
    renderSongList();
  }
  // 角色名统一（调用 PetShared；无共享时原样）
  function normIdol(id) {
    return window.PetShared ? PetShared.normIdolName(id) : id;
  }
  // 偶像名规范化（去空格转小写）
  function idolNorm(s) {
    return window.PetShared ? PetShared.idolNorm(s) : String(s || "").replace(/\s+/g, "").toLowerCase();
  }

  // 歌曲分类：unit=纯组合曲 / multi=多组合形式的组合曲 / other=非正式组合曲 / solo / all
  function songKind(s) {
    return window.PetShared ? PetShared.songKind(s) : (s.t === "all" ? "all" : (s.t === "unit" ? "unit" : (s.i && s.i.length === 1 ? "solo" : "multi")));
  }

  function renderSongList() {
    const S = window.ES_SONGS || [];
    const listEl = $("songList");
    if (!listEl) return;
    let list;
    // 全员曲模式：只看全员曲（不依赖选偶像）
    if (libSongFilter === "allstars") {
      list = S.filter((s) => s.t === "all");
    } else {
      list = S.filter((s) => s.t !== "all");
      if (songSel.size) {
        const sel = Array.from(songSel).map(normIdol);
        // 多选=共同出演：只显示所有选中偶像一起出现的曲目（交集）
        list = list.filter((s) => sel.every((idol) => s.i.some((id) => normIdol(id) === idol)));
      }
      // 「组合曲」含跨组合多组合曲（排最前）；「非组合曲」不含纯组合曲
      if (libSongFilter === "unit") list = list.filter((s) => songKind(s) === "unit");
      else if (libSongFilter === "solo") list = list.filter((s) => songKind(s) === "solo");
      else if (libSongFilter === "other") list = list.filter((s) => songKind(s) !== "unit" && songKind(s) !== "all");
    }
    if (libSongMV === "game") list = list.filter((s) => s.mv === "game");
    else if (libSongMV === "nomv") list = list.filter((s) => s.mv !== "game");
    $("songCount").textContent = libSongFilter === "allstars"
      ? `全员曲 · 共 ${list.length} 首`
      : (songSel.size ? `已选 ${songSel.size} 位偶像 · 共 ${list.length} 首` : `全部曲目 · 共 ${list.length} 首`);
    if (!list.length) {
      listEl.innerHTML = `<div class="empty2">没有符合条件（非全员曲）的曲目</div>`;
      return;
    }
    // 全员曲模式单独一组
    if (libSongFilter === "allstars") {
      listEl.innerHTML = `<div class="song-sec">全员曲 · ${list.length}</div>` + list.map(songCardHtml).join("");
      bindLibSongControls();
      return;
    }
    // 显示优先级：非组合 > 组合 > solo > 2D
    // 组合曲组：多组合曲最前 + 纯组合曲；非组合曲组：多组合曲最前 + 非正式组合曲（不含纯组合曲、不含 solo）
    const unit = list.filter((s) => songKind(s) === "unit");
    const multi = list.filter((s) => songKind(s) === "multi");
    const other = list.filter((s) => songKind(s) === "other");
    const solo = list.filter((s) => songKind(s) === "solo");
    const gameFirst = (arr) => arr.slice().sort((a, b) => (a.mv === "game" ? -1 : 0) - (b.mv === "game" ? -1 : 0));
    const inUnit = unit;
    const inOther = multi.concat(other);
    let html = "";
    if (libSongFilter === "unit") {
      html += `<div class="song-sec">组合曲 · ${inUnit.length}</div>` + gameFirst(inUnit).map(songCardHtml).join("");
    } else if (libSongFilter === "solo") {
      html += `<div class="song-sec">solo 曲 · ${solo.length}</div>` + solo.map(songCardHtml).join("");
    } else if (libSongFilter === "other") {
      if (inOther.length) html += `<div class="song-sec">非组合曲 · ${inOther.length}</div>` + gameFirst(inOther).map(songCardHtml).join("");
      if (solo.length) html += `<div class="song-sec">solo 曲 · ${solo.length}</div>` + solo.map(songCardHtml).join("");
    } else {
      // 默认「全部」：非组合曲(游戏内) → 组合曲(游戏内) → 2D 曲 → solo 曲（solo 在最末端）
      const gOther = inOther.filter((s) => s.mv === "game");
      const gUnit = inUnit.filter((s) => s.mv === "game");
      const d2 = list.filter((s) => songKind(s) !== "solo" && songKind(s) !== "all" && s.mv !== "game");
      if (gOther.length) html += `<div class="song-sec">非组合曲 · ${gOther.length}</div>` + gOther.map(songCardHtml).join("");
      if (gUnit.length) html += `<div class="song-sec">组合曲 · ${gUnit.length}</div>` + gUnit.map(songCardHtml).join("");
      if (d2.length) html += `<div class="song-sec">2D 曲 · ${d2.length}</div>` + d2.map(songCardHtml).join("");
      if (solo.length) html += `<div class="song-sec">solo 曲 · ${solo.length}</div>` + solo.map(songCardHtml).join("");
    }
    listEl.innerHTML = html;
    bindLibSongControls();
  }
  function bindLibSongControls() {
    const clearBtn = $("songClear");
    if (clearBtn) clearBtn.onclick = () => { songSel.clear(); renderSongs(); };
    document.querySelectorAll(".lib-sf .sf-btn[data-sf]").forEach((b) => {
      b.onclick = () => setLibSongFilter(b.dataset.sf);
    });
    document.querySelectorAll(".lib-sf .mv-btn").forEach((b) => {
      b.onclick = () => setLibSongMV(b.dataset.mv);
    });
  }
  function songCardHtml(s) {
    const idols = s.i.map((id) => esc(normIdol(id))).join(" · ");
    const yyy = s.yyy ? `<a href="${escAttr(s.yyy)}" target="_blank" rel="noopener">网易云试听 →</a>` : "";
    const people = s.i.length === 1 ? "solo（1人）" : (s.i.length ? `（${s.i.length}人）` : "");
    const img = s.img ? `<img class="song-cover" loading="lazy" decoding="async" src="${escAttr(imgThumb(s.img, 320))}" alt="" data-big="${escAttr(s.img)}">` : "";
    const mvTag = s.mv === "game"
      ? `<span class="song-mvtag game">游戏内</span>`
      : `<span class="song-mvtag nomv">2D/其他</span>`;
    return `<div class="song-card${s.img ? " song-hascover" : ""}">
      ${img}
      <div class="song-card-body">
        <div class="song-name" data-song="${escAttr(s.n)}">${esc(s.n)}${mvTag}${people ? ` <span class="song-cn">${people}</span>` : ""}${s.cn ? ` <span class="song-cn">${esc(s.cn)}</span>` : ""}</div>
        <div class="song-unit2">${s.u && s.u !== s.n ? esc(s.u) : ""}</div>
        <div class="song-tags">${idols}</div>
        <div class="song-src">来源：<a href="${escAttr(s.src)}" target="_blank" rel="noopener">查看</a> ${yyy} · 点卡片看详情</div>
      </div>
    </div>`;
  }

    mask.querySelectorAll("img.song-detail-cover").forEach((im) => {

  // —— 术语表 ——
  let termQ = "";
  const GLOSS_GROUPS = [
    { g: "卡池 · 招募", kw: ["招募", "卡池", "井", "保底", "复刻", "主题", "FES", "Feature", "钻石", "普池", "スカウト"] },
    { g: "活动", kw: ["演唱会", "巡演", "组合活动", "活动", "排五", "排四", "一卡线", "二卡线", "倍卡", "イベント", "ツアー"] },
    { g: "卡面 · 养成", kw: ["开花", "限界突破", "满破", "完凸", "偶像之路", "SPP", "MV衣装", "房间衣装", "SCR", "L2D", "衣装"] },
    { g: "数值 · 玩家常用词", kw: ["属性", "概率", "矿", "改判", "原石", "回忆硬币", "硬币", "推", "厨", "P", "经验"] },
  ];
  function groupedGlossary() {
    const FULL = window.ES2_FULL;
    if (!FULL || !Array.isArray(FULL.glossary) || !FULL.glossary.length) return TERMS;
    const groups = GLOSS_GROUPS.map((g) => ({ g: g.g, list: [] }));
    const rest = { g: "其他补充", list: [] };
    FULL.glossary.forEach((t) => {
      const text = (t.cn || "") + (t.jp || "") + (t.desc || "");
      let hit = null;
      for (let i = 0; i < GLOSS_GROUPS.length; i++) {
        if (GLOSS_GROUPS[i].kw.some((k) => text.includes(k))) { hit = groups[i]; break; }
      }
      (hit || rest).list.push({ name: t.cn || "?", jp: t.jp || "", desc: t.desc || "", src: t.src || "" });
    });
    return groups.concat(rest);
  }
  function renderTerms() {
    const wrap = $("termGroups");
    if (!wrap) return; // 网页版无术语页时跳过
    let html = "";
    groupedGlossary().forEach((g) => {
      const items = g.list.filter((t) =>
        !termQ || (t.name + (t.jp || "") + t.desc).toLowerCase().includes(termQ.toLowerCase())
      );
      if (!items.length) return;
      html += `<div class="term-group-title">${esc(g.g)}（${items.length}）</div>
        <div class="term-list">`;
      items.forEach((t) => {
        html += `<div class="term-card">
          <span class="t-name">${esc(t.name)}</span>${t.jp ? `<span class="t-jp">${esc(t.jp)}</span>` : ""}
          <div class="t-desc">${esc(t.desc)}</div>
          <div class="t-src">来源：${esc(t.src)}</div>
        </div>`;
      });
      html += `</div>`;
    });
    wrap.innerHTML = html || `<div class="empty2">没有匹配的术语</div>`;
  }

  // —— 全局搜索 ——
  function doSearch() {
    const q = $("libSearch").value.trim();
    // 简单路由：搜到角色/卡名 → 图鉴；术语词 → 术语页；默认留在当前页
    const G = window.EsGacha;
    if (!q) return;
    if (G && $("view-enc") && G.encCharacterList().some((id) => (G.encById(id).name + (G.encById(id).jp || "")).includes(q))) {
      const hit = G.encCharacterList().find((id) => (G.encById(id).name + (G.encById(id).jp || "")).includes(q));
      encSel = hit;
      switchPage("es");
      switchEsView("enc");
      renderEnc();
    } else if (groupedGlossary().some((g) => g.list.some((t) => t.name.includes(q) || (t.jp || "").includes(q)))) {
      termQ = q;
      switchPage("term");
      renderTerms();
    } else {
      // 全图鉴内搜索卡名/角色
      const found = [];
      (G ? G.encCharacterList() : []).forEach((id) => {
        const c = G.encById(id);
        [].concat(c.cards || [], c.outfits || []).forEach((it) => {
          if ((it.name || "").includes(q) || (c.name || "").includes(q)) {
            found.push({ c, it });
          }
        });
      });
      if (found.length) {
        encSel = found[0].c.id;
        switchPage("es");
        switchEsView("enc");
        renderEnc();
      } else {
        termQ = q;
        switchPage("term");
        renderTerms();
      }
    }
  }

  // —— 初始化 ——
  function init() {
    $("libVer").textContent = "v2.8.0";
    document.querySelectorAll(".nav-item").forEach((b) => {
      b.onclick = () => switchPage(b.dataset.page);
    });
    document.querySelectorAll(".es-tab").forEach((b) => {
      b.onclick = () => switchEsView(b.dataset.view);
    });
    document.querySelectorAll(".sm-btn").forEach((b) => {
      b.onclick = () => setLibSongMode(b.dataset.sm);
    });
    const filters = $("libSongFilters");
    if (filters) filters.hidden = true; // 简单模式默认隐藏高级筛选
    const libSearch = $("libSongSearch");
    const libClear = $("libSongSearchClear");
    if (libSearch) {
      libSearch.addEventListener("input", () => {
        if (libClear) libClear.hidden = !libSearch.value.trim();
        if (libSongMode === "list") renderLibIdolList();
        else renderSongs();
      });
      libSearch.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const q = libSearch.value.trim();
        if (!q) return;
        const qn = idolNorm(q);
        const matched = (window.ES_SONG_IDOLS || []).find((id) => {
          const nm = (window.ES_ROLE_NAMES && window.ES_ROLE_NAMES[id]) || {};
          return idolNorm(id) === qn || idolNorm(nm.ja) === qn || idolNorm(nm.en) === qn;
        });
        if (matched) {
          songSel.add(normIdol(matched));
          libSearch.value = "";
          if (libClear) libClear.hidden = true;
          renderIdolGroups();
        } else {
          // 组合名义匹配：输入企划/组合名（如 Puffy☆Bunny、La Mort）→ 自动选中该曲全部成员
          const byUnit = (window.ES_SONGS || []).find((s) => s.u && idolNorm(s.u) === qn);
          if (byUnit) {
            (byUnit.i || []).forEach((id) => songSel.add(normIdol(id)));
            libSearch.value = "";
            if (libClear) libClear.hidden = true;
            renderIdolGroups();
          } else {
            libSearch.select();
          }
        }
      });
    }
    if (libClear) libClear.onclick = () => { libSearch.value = ""; libClear.hidden = true; renderSongs(); };
    // 「确定搜索」：按已选偶像 + 当前筛选一起出结果
    const songGo = $("songGo");
    if (songGo) songGo.onclick = () => renderSongList();
    $("libSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
    $("zoomClose").onclick = closeZoom;
    $("zoomLayer").onclick = (e) => { if (e.target === $("zoomLayer")) closeZoom(); };
    document.addEventListener("click", (e) => {
      const img = e.target.closest("img.song-cover");
      if (img && img.dataset.big && !$("libCoverZoom")) {
        const mask = document.createElement("div");
        mask.id = "libCoverZoom";
        mask.className = "cover-zoom";
        const big = document.createElement("img");
        big.src = img.dataset.big;
        big.alt = "";
        mask.appendChild(big);
        mask.onclick = () => mask.remove();
        document.body.appendChild(mask);
      }
      // 歌曲详情：点卡片主体（非链接）弹出
      if (!e.target.closest("a")) {
        const body = e.target.closest(".song-card-body");
        if (body) {
          const nmEl = body.querySelector(".song-name");
          if (nmEl && nmEl.dataset.song) {
            const song = (window.ES_SONGS || []).find((s) => s.n === nmEl.dataset.song);
            if (song) showSongDetail(song);
          }
        }
      }
    });
    // 顶栏快捷按钮（网页版）：选歌 → 选歌页；排期 → 偶像梦幻祭·卡池排期；设置 → 版本日志
    const topSong = $("topSongBtn");
    if (topSong) topSong.onclick = () => { switchPage("songs"); setLibSongMode("list"); };
    const topSched = $("topSchedBtn");
    if (topSched) topSched.onclick = () => { switchPage("es"); switchEsView("sched"); };
    const topSet = $("topSetBtn");
    if (topSet) topSet.onclick = () => switchPage("log");
    switchPage("songs");
    setLibSongMode("list");
  }

  document.addEventListener("DOMContentLoaded", init);
})();



</script>
</body>
</html>
